# ===================================================================
# Student Management System - Spring Boot & MySQL Configuration
# ===================================================================

spring.application.name=student-management
server.port=8081

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
# To connect to your MySQL database:
# 1. Ensure MySQL Server is running on your machine (Default port: 3306).
# 2. Update spring.datasource.username and spring.datasource.password below with your MySQL credentials.
# Note: 'createDatabaseIfNotExist=true' automatically creates 'student_db' if it does not exist yet!
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=@Ascent1225
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate & JPA Properties
# -------------------------------------------------------------------
# 'update' automatically creates and updates 'students' and 'users' tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not run initialization scripts automatically (Hibernate creates tables)
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Logging Settings
# -------------------------------------------------------------------
logging.level.com.student.management=DEBUG
logging.level.org.springframework.web=INFO
