# ===================================================================
# Student Management System - Base Configuration
# ===================================================================

spring.application.name=student-management

# Active Profile: Defaults to 'dev' for localhost development.
# In production cloud deployments, set environment variable:
# SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port (Strictly Port 8085)
server.port=8085

# -------------------------------------------------------------------
# API Versioning & Base Path Configuration
# -------------------------------------------------------------------
api.version=v1
api.prefix=/api/${api.version}

# -------------------------------------------------------------------
# Shared PostgreSQL Database Connection Settings (Neon Cloud / Private Cloud)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-winter-rice-aorpr84f-pooler.c-2.ap-southeast-1.aws.neon.tech/school-management-db?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:school-management-db_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_YUf6AunR3JrL}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

