# ===================================================================
# PRODUCTION PROFILE: Cloud & Deployed Execution
# Activated when SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# Server Port: Dynamically binds to cloud host's $PORT (Render, Railway, AWS, Docker)
server.port=${PORT:8085}

# Production Schema Protection: Validate schema against entities, never auto-alter in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool Optimization for Production High Concurrency
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Security-Hardened Logging: Suppress sensitive query parameters
logging.level.com.student.management=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Dynamic CORS for Deployed Frontend Domains (Injected via Environment Variable)
cors.allowed-origins=${ALLOWED_ORIGINS:https://your-production-domain.com}
