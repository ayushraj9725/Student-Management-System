# ===================================================================
# DEVELOPMENT PROFILE: Localhost Execution (Active by Default)
# ===================================================================

server.port=8085

# Auto DDL update during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Detailed logging for debugging
logging.level.com.student.management=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Allowed CORS Origins for Local Development
cors.allowed-origins=http://localhost:4000,http://127.0.0.1:4000,http://localhost:3000
